services:
  bank-app:
    build: .
    container_name: bank_api
    ports:
      - "8443:8443"
    volumes:
      - type: bind
        source: ./certs/server-keystore.p12
        target: /run/secrets/server-keystore.p12
        read_only: true
      - type: bind
        source: ./certs/jwt-signing-keystore.p12
        target: /run/secrets/jwt-signing-keystore.p12
        read_only: true
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in your environment}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      - SSL_KEY_STORE=file:/run/secrets/server-keystore.p12
      - SSL_PASSWORD=${SSL_PASSWORD:?Set SSL_PASSWORD in your environment}
      - JWT_KEY_STORE=file:/run/secrets/jwt-signing-keystore.p12
      - JWT_KEY_STORE_PASSWORD=${JWT_KEY_STORE_PASSWORD:?Set JWT_KEY_STORE_PASSWORD in your environment}
      - JWT_KEY_PASSWORD=${JWT_KEY_PASSWORD:?Set JWT_KEY_PASSWORD in your environment}
      - JWT_KEY_ALIAS=${JWT_KEY_ALIAS:-jwt-signing}
      - AES_DB_KEY=${AES_DB_KEY:?Set AES_DB_KEY (16, 24, or 32 UTF-8 bytes) in your environment}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:?Set GITHUB_CLIENT_ID in your environment}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:?Set GITHUB_CLIENT_SECRET in your environment}
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: bank_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      POSTGRES_DB: bank_inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bank_redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in your environment}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: