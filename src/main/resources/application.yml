server:
  port: 8443
  ssl:
    enabled: true
    key-store-type: PKCS12
    key-store: "${SSL_KEY_STORE:file:./certs/server-keystore.p12}"
    key-store-password: "${SSL_PASSWORD}"
    enabled-protocols: TLSv1.3,TLSv1.2

spring:
  application:
    name: bank-sample-app

  # Database Persistence (PostgreSQL)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bank_inventory}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # ORM / Hibernate Settings
  jpa:
    hibernate:
      ddl-auto: update # Change to 'validate' or 'none' in production environments
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Token Revocation & Session Cache (Redis)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms

  # OAuth2 Federated Login Providers
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
#          google:
#            client-id: ${GOOGLE_CLIENT_ID:dummy-google-id}
#            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-secret}
#            scope:
#              - openid
#              - profile
#              - email

# Application-Level Security Variables
security:
  jwt:
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
    key-store: "${JWT_KEY_STORE:file:./certs/jwt-signing-keystore.p12}"
    key-store-password: "${JWT_KEY_STORE_PASSWORD}"
    key-password: "${JWT_KEY_PASSWORD}"
    key-alias: ${JWT_KEY_ALIAS:jwt-signing}